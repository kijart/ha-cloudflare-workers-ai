rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register any actions.
  appropriate-polling:
    status: exempt
    comment: The STT and TTS entities call the API on demand and do not poll.
  brands:
    status: todo
    comment: No brand images are shipped yet.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No runtime requirements; HTTP uses the aiohttp session of Home Assistant.
  docs-actions:
    status: exempt
    comment: The integration does not register any actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: The entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not register any actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: >
      STT and TTS entities have no state to poll; each request reports its own
      failure, and the entities stay available while the daily quota is exhausted.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >
      The exhausted daily quota is logged once per UTC day; other failures are
      logged once per user-triggered request.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service without anything to discover on the network.
  discovery-update-info:
    status: exempt
    comment: Cloud service without anything to discover on the network.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: The README has no automation examples yet.
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Cloud service without physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: A single service device per config entry.
  entity-category:
    status: exempt
    comment: STT and TTS entities are primary entities without a category.
  entity-device-class:
    status: exempt
    comment: STT and TTS entities have no device class.
  entity-disabled-by-default:
    status: exempt
    comment: Both entities are the purpose of the integration.
  entity-translations: done
  exception-translations:
    status: todo
    comment: ConfigEntryAuthFailed and ConfigEntryNotReady carry untranslated messages.
  icon-translations:
    status: exempt
    comment: The STT and TTS platform default icons are used.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: A single service device per config entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: No runtime requirements; the client is part of the integration.
  inject-websession: done
  strict-typing: done
